[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.16.0"
authors = ["The Wasmtime Project Developers"]
license = "Apache-2.0 WITH LLVM-exception"

[workspace.dependencies]
wasm-pkg-client = { version = "0.16.0", path = "crates/wasm-pkg-client" }
wasm-pkg-common = { version = "0.16.0", path = "crates/wasm-pkg-common" }
wasm-pkg-core = { version = "0.16.0", path = "crates/wasm-pkg-core" }

anstream = "1.0"
anstyle = "1.0"
anyhow = "1"
async-trait = "0.1.91"
base16ct = { version = "1.0", features = ["alloc"] }
base64 = "0.23"
bytes = "1.12"
clap = "4.6"
colorchoice-clap = "1.0"
docker_credential = "1.4.0"
etcetera = "0.11"
futures-util = "0.3.33"
glob = "0.3.4"
http = "1.4.2"
indexmap = "2.14"
oci-client = { version = "0.17", default-features = false, features = [
    "rustls-tls",
] }
oci-wasm = { version = "0.6", default-features = false, features = [
    "rustls-tls",
] }
petgraph = "0.8.3"
rcgen = "0.14.8"
reqwest = { version = "0.13.4", default-features = false }
rstest = "0.26"
secrecy = "0.10"
semver = "1.0.28"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tempfile = "3.27.0"
testcontainers = "0.27.3"
thiserror = "2.0"
tokio = "1.53.1"
tokio-util = "0.7.19"
toml = "1.1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = [
    "fmt",
    "env-filter",
] }
url = "2.5.8"

wasm-metadata = "0.254"
wit-component = "0.254"
wit-parser = "0.254"

# https://github.com/crate-ci/typos/blob/master/docs/reference.md
[workspace.metadata.typos.default]
extend-ignore-re = ["\\d\\w{4,}\\d"]
extend-ignore-words-re = [
    '^[a-zA-Z]{1,3}$', # ignore words up to length 3
]

[workspace.metadata.typos.default.extend-words]
# strategy shorthand
strat = "strat"
